name: Website veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Website zusammenstellen
        run: |
          mkdir _site
          cp -r index.html admin impressum datenschutz robots.txt css js images _site/
          rm -f _site/js/firebase-config.example.js
          # Versionsnummer an alle Skript-, Stil- und Modul-Adressen hängen, damit Browser keine alten Dateien mischen
          V="${GITHUB_SHA::8}"
          sed -i -E "s#(from '\./[a-z-]+\.js)'#\1?v=$V'#g; s#import\('\./firebase-config\.js'\)#import('./firebase-config.js?v=$V')#" _site/js/*.js
          sed -i -E "s#(src=\"(\.\./)?js/[a-z-]+\.js)\"#\1?v=$V\"#g; s#(href=\"(\.\./)?css/[a-z-]+\.css)\"#\1?v=$V\"#g" _site/index.html _site/admin/index.html _site/impressum/index.html _site/datenschutz/index.html

      - name: Firebase-Konfiguration aus GitHub Secrets schreiben
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          if [ -z "$FIREBASE_API_KEY" ] || [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "::warning::Firebase-Secrets fehlen. Die Website läuft dann mit den Standardpreisen."
            exit 0
          fi
          cat > _site/js/firebase-config.js <<CONFIG
          export const firebaseConfig = {
            apiKey: '${FIREBASE_API_KEY}',
            authDomain: '${FIREBASE_AUTH_DOMAIN}',
            projectId: '${FIREBASE_PROJECT_ID}',
            appId: '${FIREBASE_APP_ID}',
          };
          CONFIG

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
